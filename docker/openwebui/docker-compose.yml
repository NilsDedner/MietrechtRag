services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mietrecht_openwebui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: ${RAG_ADAPTER_BASE_URL:-http://host.docker.internal:8010/v1}
      OPENAI_API_KEY: ${RAG_ADAPTER_API_KEY:-dummy-key}
      ENABLE_OLLAMA_API: "False"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openwebui_data:/app/backend/data

volumes:
  openwebui_data:
