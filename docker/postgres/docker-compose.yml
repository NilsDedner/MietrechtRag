services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mietrecht_pg
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - mietrecht_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mietrecht_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mietrecht_pgadmin:/var/lib/pgadmin

volumes:
  mietrecht_pgdata:
  mietrecht_pgadmin:
