[project]
name = "mietrecht-rag"
version = "0.1.0"
description = "ETL und RAG-Pipeline für Mietrecht (OpenLegalData)"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "psycopg2-binary>=2.9.9",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["etl*"]
